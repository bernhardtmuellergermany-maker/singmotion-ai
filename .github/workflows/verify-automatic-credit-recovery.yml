name: Verify automatic Credit video recovery
on:
  pull_request:
    branches: [production, staging]
    paths:
      - 'lib/commerce/automatic-credit-recovery.ts'
      - 'scripts/worker.ts'
      - 'tests/automatic-credit-recovery.test.ts'
      - '.github/workflows/verify-automatic-credit-recovery.yml'
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.22.3'
          cache: npm
      - run: npm ci
      - run: node --experimental-strip-types --test tests/automatic-credit-recovery.test.ts tests/support-cases.test.ts tests/credit-wallet.test.ts
      - run: npm run typecheck
