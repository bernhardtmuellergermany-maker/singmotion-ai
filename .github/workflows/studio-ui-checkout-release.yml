name: Studio UI and checkout release verification
on:
  pull_request:
    branches:
      - staging
      - production
  workflow_dispatch:

concurrency:
  group: studio-release-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24.22.3'
          cache: npm
      - run: npm ci
      - name: Lint and typecheck
        run: |
          npm run lint
          npm run typecheck
      - name: Install FFmpeg for video regression tests
        run: sudo apt-get install -y ffmpeg
      - name: Customer payment security and production build
        run: |
          node --experimental-strip-types --test tests/studio-order-key.test.ts tests/stripe-error-diagnostics.test.ts tests/stripe-video-tax-code.test.ts
          npm run test:customer:release
          npm run build
