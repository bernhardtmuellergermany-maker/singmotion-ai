name: Validate private staging without paid services

on:
  pull_request:
    branches:
      - fix/tempo-distinguish-provider-errors-20261028
      - feat/super-admin-promo-codes-20261103
      - feat/automatic-customer-video-worker-20261105
      - feat/owner-confirmed-byteplus-pricing-checkout-20261105
      - feat/stripe-live-customer-release-preflight-20261105
      - fix/production-customer-session-and-release-safety-20261105
      - fix/stripe-live-permissions-20261105
      - fix/stripe-endive-hobby-invoice-20261105
  push:
    branches:
      - fix/tempo-distinguish-provider-errors-20261028
      - feat/super-admin-promo-codes-20261103
      - feat/automatic-customer-video-worker-20261105
      - feat/owner-confirmed-byteplus-pricing-checkout-20261105
      - feat/stripe-live-customer-release-preflight-20261105
      - fix/production-customer-session-and-release-safety-20261105
      - fix/stripe-live-permissions-20261105
      - fix/stripe-endive-hobby-invoice-20261105
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: private-staging-validation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  offline-validation:
    name: Offline tests, build and staging security
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CI: "true"
    steps:
      - name: Check out exact revision
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - name: Install FFmpeg for synthetic media fixtures
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          ffmpeg -version
          ffprobe -version
      - name: Install locked dependencies
        run: npm ci
      - name: Promotion unit and redemption regression tests
        run: node --experimental-strip-types --test tests/promotions.test.ts
      - name: TypeScript checks
        run: npm run typecheck
      - name: CMS compatibility checks without a live database
        run: npm run test:cms:compat
      - name: Production build and security audit
        run: npm run build
      - name: Private staging authorization and worker smoke test
        run: npm run test:staging
      - name: Offline unit and integration tests
        run: npm test
      - name: Repository-wide lint (reported after functional checks)
        run: npm run lint
