name: Customer launch release verification

on:
  push:
    branches:
      - phase2/customer-launch-safety-20261106
      - fix/require-production-stripe-product-20261109
      - test/p0-paid-ambiguous-submission-20261110
      - feat/guest-paid-video-no-account-20261110
      - feat/video-ready-email-guest-claim-20261110
      - fix/p0-guest-checkout-session-and-links-20261110
      - fix/enable-reviewed-300s-orders-20261110
      - fix/p0-studio-checkout-diagnostics-20261110
      - fix/p0-r2-nonblocking-prod-canary-20261110
      - fix/consumer-withdrawal-template-20261109
      - fix/verified-legal-operator-imprint-20261109
      - fix/production-customer-byteplus-policy-railway-20261109
      - fix/hobby-revocation-survives-checkout-stop-20261109
      - fix/stripe-reversal-after-checkout-pause-20261109
      - fix/contact-turnstile-action-bound-20261109
      - fix/hobby-live-checkout-production-product-20261109
  pull_request:
    branches:
      - phase1/release-export-gates-20261106
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: customer-launch-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  customer-launch-regressions:
    name: Offline customer auth, Stripe, provider and private delivery gates
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CI: "true"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "24.22.1"
          cache: npm
      - name: Install synthetic video regression tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
      - run: npm ci
      - name: Hobby cancellation safety while checkout is paused
        run: node --experimental-strip-types --test tests/stripe-hobby-pause-policy.test.ts
      - name: Statutory sample withdrawal form regression
        run: node --test tests/consumer-withdrawal-template.test.mjs
      - name: Verified imprint and privacy contact regressions
        run: node --test tests/legal-operator-details.test.mjs
      - name: Contact Turnstile action and hostname security
        run: node --experimental-strip-types --test tests/contact-turnstile.test.ts
      - name: Release parity and production fail-closed gates
        run: |
          npm run test:release-parity
          npm run test:customer:release
      - name: Production build with full customer and video regression gates
        run: npm run build
