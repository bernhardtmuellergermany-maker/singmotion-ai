name: Super Admin recovery safety
on:
  pull_request:
    branches: [design/studio-audio-redesign-20261111]
    paths:
      - 'app/(site)/api/support-admin/**'
      - 'app/(site)/support-admin/**'
      - 'app/(site)/account/settings/**'
      - 'components/admin-account-dashboard.tsx'
      - 'components/my-projects-gallery.tsx'
      - 'components/my-projects-gallery.css'
      - 'tests/customer-output.browser.ts'
      - 'lib/commerce/admin-support-overview.ts'
      - 'lib/project-trash*.ts'
      - 'tests/project-trash-retention.test.ts'
      - 'app/**/api/**/route.ts'
      - 'components/my-projects-gallery.*'
      - 'lib/live/studio.ts'
      - 'scripts/worker.ts'
      - 'tests/account-settings-admin-status.test.ts'
      - 'components/support-admin.*'
      - 'lib/commerce/support-*.ts'
      - 'lib/commerce/credit-wallet.ts'
      - 'lib/commerce/store.ts'
      - 'app/(site)/api/stripe-webhook/route.ts'
      - 'scripts/worker.ts'
      - 'tests/support-cases.test.ts'
      - 'package.json'
      - '.github/workflows/support-admin-recovery.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: super-admin-recovery-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24.22.1'
          cache: npm
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg chromium
      - run: npm ci
      - run: npm run typecheck
      - run: node --experimental-strip-types --test tests/support-cases.test.ts tests/account-settings-admin-status.test.ts
      - run: npm run build
      - name: Payment and private Output browser regression
        run: PLAYWRIGHT_CHROMIUM_EXECUTABLE_PATH=/usr/bin/chromium npm run test:customer:browser
