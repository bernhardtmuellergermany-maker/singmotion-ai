name: Studio standard login and guest draft resume
on:
  pull_request:
    paths:
      - "components/studio-wizard.tsx"
      - "components/studio-account-resume.tsx"
      - "components/account-panel.tsx"
      - "lib/studio-account-handoff.ts"
      - "app/(site)/api/google-auth/**"
      - "tests/studio-account-flow.test.ts"
      - "tests/studio-auth-resume.browser.ts"
      - "package.json"
      - ".github/workflows/studio-auth-resume.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24.22.3"
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: node --experimental-strip-types --test tests/studio-account-flow.test.ts tests/studio-credit-resume-step4.test.ts tests/studio-direct-generation-ui.test.ts
